plugins {
    id "com.android.application"
}

android {
    namespace "com.ciyuanji.lsposed"
    compileSdk 35

    defaultConfig {
        applicationId "com.ciyuanji.lsposed"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // LSPosed/Xposed API is provided by the framework at runtime.
    compileOnly "de.robv.android.xposed:api:82"
}
